[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fastframe"
version = "0.1.0"
description = "Deterministic source rewrites for common pandas anti-patterns"
requires-python = ">=3.12,<3.13"
dependencies = [
    "libcst>=1.0,<2",
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "rich>=13,<15",
    "typer>=0.12,<1",
]

[project.scripts]
fastframe = "fastframe.cli:main"

[project.optional-dependencies]
test = [
    "hypothesis>=6,<7",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[tool.fastframe]
select = []
ignore = []

[tool.setuptools.packages.find]
where = ["src"]
