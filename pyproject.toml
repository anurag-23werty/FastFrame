[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fastframe"
version = "0.1.0"
description = "Deterministic source rewrites for common pandas anti-patterns"
requires-python = ">=3.12,<3.13"
dependencies = [
    "libcst>=1.0,<2",
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "rich>=13,<15",
    "typer>=0.12,<1",
]

[project.scripts]
fastframe = "fastframe.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
